# Só o banco roda em container. A API roda no host (precisa do Cofre do Windows via keyring).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sprintai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sprintai}
      POSTGRES_USER: ${DB_USER:-sprintai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sprintai}
    ports:
      # Publicado só em loopback: o banco não fica exposto na rede.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - sprintai-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sprintai-pgdata:
