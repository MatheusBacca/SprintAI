<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SprintAI</title>
    <!-- Mesmo selo da barra lateral (Sparkles no degradê primário do tema claro). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Antes de qualquer pintura: sem isto a tela pisca branca até o Vue montar.
      // Sem preferência salva, segue o sistema (o store cuida do resto).
      ;(function () {
        try {
          var saved = localStorage.getItem('sprintai.theme')
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.dataset.theme = 'dark'
        } catch (e) {
          // localStorage bloqueado: fica no claro
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
